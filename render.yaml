# Render Blueprint — https://render.com/docs/blueprint-spec
# The database lives on Neon (free tier does not expire), so it is not declared here.
services:
  - type: web
    name: fintrack-api
    runtime: docker
    plan: free
    region: virginia # same region as the Neon database (aws-us-east-1)
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Neon connection string, set in the dashboard
      - key: CORS_ORIGINS
        sync: false # e.g. https://fintrack.vercel.app
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN_DAYS
        value: '7'
      - key: TRUST_PROXY_HOPS
        value: '3' # proxies in Render's chain (see SECURITY.md for how this was verified)
      - key: SEED_DEMO_ON_START
        value: 'true'
